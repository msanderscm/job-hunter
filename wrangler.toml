name = "job-digest"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"

# Built React app (output of `vite build`). Requests for files that exist here
# are served directly; /api/* always hits the Worker; everything else that
# doesn't match a file falls back to index.html (SPA).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/__scheduled"]

[[d1_databases]]
binding = "DB"
database_name = "job-digest"
# Replace with the id printed by `wrangler d1 create job-digest`.
database_id = "92724e02-86d0-46d3-8eb2-395efa6e78eb"
migrations_dir = "migrations"

# Workers AI — used by the Hacker News source to judge "Who is hiring" posts.
[ai]
binding = "AI"

[triggers]
crons = ["0 6,10 * * *"]

[observability]
enabled = true
